<div class="sliding-grid" data-sliding-board data-focus-board tabindex="0" role="group" aria-label="{{ if eq .Language.Lang "en" }}Sliding puzzle. Arrow keys or WASD move the empty space. Space pauses{{ else }}数字滑块，方向键或 WASD 移动空位，空格暂停{{ end }}">
    {{ range seq 0 8 }}<button type="button" class="sliding-cell" data-slide-index="{{ . }}" tabindex="-1" disabled></button>{{ end }}
</div>
