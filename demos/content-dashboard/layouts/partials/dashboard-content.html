<section class="panel content-panel" aria-labelledby="content-heading">
  <div class="table-heading"><div><p class="eyebrow">逐条看稿件</p><h2 id="content-heading">内容记录</h2></div><p id="result-summary" role="status" aria-live="polite" aria-atomic="true">共 {{ len . }} 条内容</p></div>
  {{ partial "dashboard-record-table.html" . }}
  <div id="empty-state" class="empty-state" hidden><span class="empty-mark" aria-hidden="true">∅</span><h3>没有符合条件的内容</h3><p>试试更换月份、渠道或关键词，也可以重置筛选。</p></div>
  <p class="table-note">互动率 = 互动次数 ÷ 阅读次数 × 100%；阅读次数为零时显示 0.00%。</p>
</section>
