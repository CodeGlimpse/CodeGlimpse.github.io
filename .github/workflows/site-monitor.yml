name: Monitor deployed site

on:
    schedule:
        # Run a full endpoint and asset check daily after the regular release window.
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: site-monitor
    cancel-in-progress: true

env:
    NODE_VERSION: "22.13.1"
    SITE_URL: "https://blog.codeglimpse.top"
    SITE_EXPECT_CLARITY: "true"
    SITE_SOURCE_COMMIT: "${{ github.sha }}"
    SITE_CHECK_RETRIES: "3"
    SITE_CHECK_RETRY_DELAY_MS: "2000"

jobs:
    monitor:
        name: Check deployed site
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
              with:
                  fetch-depth: 1

            - name: Setup Node.js
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install Node.js dependencies
              run: npm ci --ignore-scripts

            - name: Check deployed endpoints and local assets
              run: npm run check:site

            - name: Write monitor summary
              if: always()
              run: |
                  {
                    echo "## Deployed site monitor"
                    echo ""
                    echo "- Site: ${SITE_URL}"
                    echo "- Source repository: ${GITHUB_REPOSITORY}"
                    echo "- Workflow run: ${GITHUB_RUN_ID}"
                    echo "- Check: all bilingual tools, metadata, resources, and expected 404s"
                  } >> "${GITHUB_STEP_SUMMARY}"
