<div class="book-cover cover--{{ .book.cover }}" aria-hidden="true">
  <span class="cover-series">{{ site.Home.Params.brandMark }}选书 / {{ .book.category }}</span>
  <span class="cover-title">{{ .book.title }}</span>
  <span class="cover-author">{{ .book.author }} 著</span>
  <span class="cover-art"{{ if or (strings.HasPrefix .book.cover "art-") (strings.HasPrefix .book.cover "life-") }} style="background-image: url('{{ printf "illustrations/covers/%s.svg" .book.cover | relURL }}')"{{ end }}></span>
  <span class="cover-edition">{{ site.Home.Params.brandMark }} <span>{{ printf "%02d" .number }}</span></span>
</div>
