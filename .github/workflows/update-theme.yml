name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Update theme automatically everyday at 00:00 UTC
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.6
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 0.157.0
          extended: true

      - name: Update theme
        run: hugo mod get -u github.com/CaiJimmy/hugo-theme-stack/v3

      - name: Tidy go.mod, go.sum
        run: hugo mod tidy

      - name: Verify build
        run: hugo --gc --minify

      - name: Create theme update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update Hugo theme"
          branch: automation/update-hugo-theme
          delete-branch: true
          base: master
          title: "chore: update Hugo theme"
          body: |
            This pull request was created automatically by the scheduled theme update workflow.

            Hugo and Go versions used by the workflow:
            - Hugo: 0.157.0 extended
            - Go: 1.23.6
