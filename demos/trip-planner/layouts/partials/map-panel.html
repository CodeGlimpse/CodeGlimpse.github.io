{{ $scene := site.Home.Params }}
<section class="panel map-panel" aria-labelledby="terrain-heading">
  <header class="panel-heading"><div><p class="panel-kicker">{{ $scene.mapKicker }}</p><h2 id="terrain-heading" tabindex="-1">{{ $scene.mapTitle }}</h2></div><span class="map-scale" aria-hidden="true">{{ len site.Data.places }} 处停靠</span></header>
  <svg class="terrain-map" data-map-scene="{{ $scene.mapScene }}" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="map-title map-description"><title id="map-title">{{ $scene.mapDescription }}</title><desc id="map-description">八个虚构地点的示意位置。橙色连线与数字按行程顺序更新。非真实地理导航。</desc>
    {{ if eq $scene.mapScene "oldtown" }}{{ partial "map-oldtown.html" . }}{{ else }}{{ partial "map-mountain.html" . }}{{ end }}
    <polyline id="itinerary-route" class="map-route" points="" hidden/>
    {{ partial "map-pins.html" (dict "interactive" false) }}
  </svg>
  <div class="map-caption"><p><span class="route-swatch" aria-hidden="true"></span>橙线与数字按行程顺序连接</p><p>原创地图示意 · 非真实地理导航</p></div>
  <div class="map-note"><span aria-hidden="true">{{ $scene.brandGlyph }}</span><p>{{ $scene.mapNote }}</p></div>
</section>
