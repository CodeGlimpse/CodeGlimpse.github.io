name: Build and deploy to GitHub Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

env:
    GO_VERSION: "1.23.6"
    HUGO_VERSION: "0.157.0"
    NODE_VERSION: "22.13.1"

jobs:
    build:
        name: Build and test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Cache Hugo resources
              uses: actions/cache@v4
              with:
                  path: resources
                  key: ${{ runner.os }}-hugo-resources-${{ hashFiles('go.mod', 'go.sum', 'config/_default/module.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-hugo-resources-

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v2
              with:
                  hugo-version: ${{ env.HUGO_VERSION }}
                  extended: true

            - name: Check JavaScript syntax
              run: npm run check:js

            - name: Check toolchain versions
              run: npm run check:versions

            - name: Check content structure
              run: npm run check:content

            - name: Run tests
              run: npm test

            - name: Build
              run: hugo --cleanDestinationDir --minify --gc

            - name: Check build output
              run: npm run check:output

            - name: Upload site artifact
              uses: actions/upload-artifact@v4
              with:
                  name: github-pages-site
                  path: public
                  if-no-files-found: error
                  retention-days: 1

    deploy:
        name: Deploy
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Download site artifact
              uses: actions/download-artifact@v4
              with:
                  name: github-pages-site
                  path: public

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
                  commit-message: "deploy: source=${{ github.sha }}"

            - name: Smoke test deployed site
              env:
                  SITE_URL: "https://blog.codeglimpse.top"
              run: npm run check:site
