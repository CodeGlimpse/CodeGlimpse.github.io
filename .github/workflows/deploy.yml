name: Build and deploy to GitHub Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

env:
    GO_VERSION: "1.23.6"
    HUGO_VERSION: "0.157.0"
    NODE_VERSION: "22.13.1"

jobs:
    build:
        name: Build and test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Setup Node.js
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install Node.js dependencies
              run: npm ci --ignore-scripts

            - name: Cache Hugo resources
              uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
              with:
                  path: resources
                  key: ${{ runner.os }}-hugo-resources-${{ hashFiles('go.mod', 'go.sum', 'config/_default/module.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-hugo-resources-

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@6b1ee2dcc06c9b6629a5317fa0146473914d05e1 # v3
              with:
                  hugo-version: ${{ env.HUGO_VERSION }}
                  extended: true

            - name: Check JavaScript syntax
              run: npm run check:js

            - name: Check workflow security
              run: npm run check:workflow

            - name: Check toolchain versions
              run: npm run check:versions

            - name: Check content structure
              run: npm run check:content

            - name: Check distributed cleanup scripts
              run: npm run check:scripts

            - name: Check color contrast
              run: npm run check:contrast

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Check build output
              env:
                  SOURCE_COMMIT: ${{ github.sha }}
              run: npm run check:output

            - name: Write build summary
              if: always()
              env:
                  SUMMARY_STAGE: build
              run: node scripts/write-site-summary.cjs

            - name: Upload site artifact
              uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
              with:
                  name: github-pages-site
                  path: public
                  if-no-files-found: error
                  retention-days: 1

    e2e:
        name: Browser end-to-end
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
              with:
                  fetch-depth: 1

            - name: Setup Node.js
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install Node.js dependencies
              run: npm ci --ignore-scripts

            - name: Download site artifact
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
              with:
                  name: github-pages-site
                  path: public

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Run browser tests
              env:
                  E2E_BASE_URL: http://127.0.0.1:4173
                  E2E_USE_LOCAL_SERVER: "true"
              run: npm run test:e2e

            - name: Upload browser failure artifacts
              if: failure()
              uses: actions/upload-artifact@615b319bd27bb32c3d64dca6b6ed6974d5fbe653 # v6.0.0
              with:
                  name: playwright-failure-${{ github.run_id }}
                  path: |
                      playwright-report
                      test-results
                  if-no-files-found: ignore
                  retention-days: 7

    deploy:
        name: Deploy
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        needs: [build, e2e]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Download site artifact
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
              with:
                  name: github-pages-site
                  path: public

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@6c2d9db40f9296374acc17b90404b6e8864128c8 # v4.7.3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
                  commit-message: "deploy: source=${{ github.sha }}"

            - name: Smoke test deployed site
              env:
                  SITE_URL: "https://blog.codeglimpse.top"
                  SITE_EXPECT_CLARITY: "true"
                  SITE_SOURCE_COMMIT: ${{ github.sha }}
                  # GitHub Pages custom-domain/CDN propagation can briefly serve the previous HTML.
                  SITE_CHECK_RETRIES: "24"
                  SITE_CHECK_RETRY_DELAY_MS: "5000"
              run: npm run check:site

            - name: Write deployment summary
              if: always()
              env:
                  SUMMARY_STAGE: deploy
              run: node scripts/write-site-summary.cjs
