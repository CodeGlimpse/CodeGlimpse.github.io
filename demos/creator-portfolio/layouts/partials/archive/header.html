<header class="archive-masthead"><div class="shell archive-masthead-inner"><a class="archive-brand" href="{{ site.Home.RelPermalink }}" aria-label="返回作品集首页"><span class="archive-brand-dot" aria-hidden="true"></span>{{ site.Home.Params.brand }}</a><span class="archive-system-label">{{ site.Home.Params.edition }}</span><nav aria-label="主导航">{{ range slice "works" "projects" }}{{ $section := site.GetPage (printf "/%s" .) }}<a href="{{ $section.RelPermalink }}"{{ if eq $.Section . }} aria-current="page"{{ end }}>{{ $section.Title }}</a>{{ end }}</nav></div></header>
