<div class="book-cover cover--{{ .book.cover }}" aria-hidden="true">
  <span class="cover-series">纸间原创 · {{ .book.category }}</span>
  <span class="cover-title">{{ .book.title }}</span>
  <span class="cover-author">{{ .book.author }} / 著</span><span class="cover-art"></span>
  <span class="cover-edition">ZHIJIAN <span>{{ printf "%02d" .number }}</span></span>
</div>
