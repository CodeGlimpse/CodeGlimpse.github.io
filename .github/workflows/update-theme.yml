name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Update theme automatically everyday at 00:00 UTC
    - cron: "0 0 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest

    env:
      GO_VERSION: "1.23.6"
      HUGO_VERSION: "0.157.0"
      NODE_VERSION: "22.13.1"

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Update theme
        run: hugo mod get -u github.com/CaiJimmy/hugo-theme-stack/v3

      - name: Tidy go.mod, go.sum
        run: hugo mod tidy

      - name: Remove generated editor cache paths
        run: git restore --source=HEAD -- assets/jsconfig.json

      - name: Verify build
        run: |
          npm run check:versions
          npm run check:js
          npm run check:content
          npm test
          hugo --cleanDestinationDir --gc --minify
          npm run check:output

      - name: Create theme update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update Hugo theme"
          branch: automation/update-hugo-theme
          delete-branch: true
          base: master
          add-paths: |
            go.mod
            go.sum
          title: "chore: update Hugo theme"
          body: |
            This pull request was created automatically by the scheduled theme update workflow.

            Hugo and Go versions used by the workflow:
            - Hugo: ${{ env.HUGO_VERSION }} extended
            - Go: ${{ env.GO_VERSION }}
            - Node.js: ${{ env.NODE_VERSION }}
