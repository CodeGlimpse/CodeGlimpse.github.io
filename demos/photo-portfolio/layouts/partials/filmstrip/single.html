<main id="main" class="magazine-detail shell" tabindex="-1"><a class="magazine-text-link" href="{{ .CurrentSection.RelPermalink }}">← 全部作品</a><header class="magazine-detail-heading" data-magazine-section><div><p class="magazine-kicker">SERIES / {{ .Params.series }}</p><h1>{{ .Title }}</h1></div><p>{{ .Params.summary }}</p><span aria-hidden="true">{{ printf "%02d" .Weight }}</span></header><figure class="detail-figure magazine-detail-cover" data-magazine-section>{{ partial "responsive-image.html" (dict "page" . "name" .Params.cover "alt" .Params.cover_alt "sizes" "(max-width: 800px) 100vw, 90vw" "loading" "eager" "class" "detail-picture") }}<figcaption>01 / {{ .Title }} · AI 生成演示影像</figcaption></figure><div class="magazine-image-notes" data-magazine-section><p class="magazine-kicker">IMAGE NOTES</p><div class="prose">{{ .Content }}</div></div>{{ with .Params.detail }}<figure class="detail-figure magazine-detail-secondary" data-magazine-section>{{ partial "responsive-image.html" (dict "page" $ "name" . "alt" $.Params.detail_alt "sizes" "(max-width: 800px) 100vw, 90vw" "class" "detail-picture") }}<figcaption>02 / {{ $.Params.detail_caption }}</figcaption></figure>{{ end }}<div class="magazine-detail-next"><p>继续浏览</p><a class="magazine-text-link" href="{{ .CurrentSection.RelPermalink }}">返回全部作品 ↗</a></div></main>
