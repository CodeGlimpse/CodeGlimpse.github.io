name: Update theme

# Controls when the workflow will run
on:
  schedule:
    # Review theme updates weekly at 00:00 UTC on Monday.
    - cron: "0 0 * * 1"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-theme:
    runs-on: ubuntu-latest

    env:
      GO_VERSION: "1.23.6"
      HUGO_VERSION: "0.157.0"
      NODE_VERSION: "22.13.1"

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@19661a5c56c987b713f1f00f022671286b04f53b # v2.0.0
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Update theme
        run: hugo mod get -u github.com/CaiJimmy/hugo-theme-stack/v3

      - name: Tidy go.mod, go.sum
        run: hugo mod tidy

      - name: Remove generated editor cache paths
        run: git restore --source=HEAD -- assets/jsconfig.json

      - name: Verify build
        run: |
          npm run check:versions
          npm run check:workflow
          npm run check:js
          npm run check:content
          npm test
          hugo --cleanDestinationDir --gc --minify
          npm run check:output

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_USE_LOCAL_SERVER: "true"
        run: npm run test:e2e

      - name: Write theme update summary
        if: always()
        env:
          SUMMARY_STAGE: theme-update
        run: |
          node scripts/write-site-summary.cjs
          {
            echo ""
            echo "### Module changes"
            git diff --stat -- go.mod go.sum
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Create theme update pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          commit-message: "chore: update Hugo theme"
          branch: automation/update-hugo-theme
          delete-branch: true
          base: master
          add-paths: |
            go.mod
            go.sum
          title: "chore: update Hugo theme"
          body: |
            This pull request was created automatically by the scheduled theme update workflow.

            The update is validated with the version, workflow, JavaScript, content, unit-test, Hugo build, output, and browser E2E checks.

            Hugo and Go versions used by the workflow:
            - Hugo: ${{ env.HUGO_VERSION }} extended
            - Go: ${{ env.GO_VERSION }}
            - Node.js: ${{ env.NODE_VERSION }}
