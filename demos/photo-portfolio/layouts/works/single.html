{{ define "main" }}
<main id="main" class="shell detail-page" tabindex="-1">
  <a class="back-link" href="{{ .CurrentSection.RelPermalink }}"><span aria-hidden="true">←</span> 全部作品</a>
  <header class="detail-heading">
    <div>
      <p class="eyebrow">SERIES / {{ .Params.series }}</p>
      <h1>{{ .Title }}</h1>
    </div>
    <p>{{ .Params.summary }}</p>
  </header>
  <figure class="detail-figure">
    {{ partial "responsive-image.html" (dict "page" . "name" .Params.cover "alt" .Params.cover_alt "sizes" "(max-width: 800px) 100vw, 90vw" "loading" "eager" "class" "detail-picture") }}
    <figcaption>01 / {{ .Title }} · AI 生成演示影像</figcaption>
  </figure>
  <div class="detail-story">
    <p class="eyebrow">IMAGE NOTES</p>
    <div class="prose">{{ .Content }}</div>
  </div>
  {{ with .Params.detail }}
  <figure class="detail-figure detail-secondary">
    {{ partial "responsive-image.html" (dict "page" $ "name" . "alt" $.Params.detail_alt "sizes" "(max-width: 800px) 100vw, 90vw" "class" "detail-picture") }}
    <figcaption>02 / {{ $.Params.detail_caption }}</figcaption>
  </figure>
  {{ end }}
  <div class="detail-next">
    <p>继续浏览</p>
    <a class="text-link" href="{{ .CurrentSection.RelPermalink }}">返回全部作品 <span aria-hidden="true">↗</span></a>
  </div>
</main>
{{ end }}
