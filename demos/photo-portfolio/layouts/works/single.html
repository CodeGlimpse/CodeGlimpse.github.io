{{ define "main" }}<main id="main" class="genre-detail shell" tabindex="-1"><a href="{{ "works/" | relURL }}">返回全部作品</a><header><p class="genre-eyebrow">{{ .Params.series }}</p><h1>{{ .Title }}</h1><p>{{ .Params.summary }}</p></header><figure class="detail-figure">{{ partial "genres/image.html" (dict "page" . "loading" "eager" "sizes" "90vw") }}<figcaption>{{ .Params.cover_alt }} · {{ .Params.author }}</figcaption></figure><button class="image-expand" type="button" hidden data-image="{{ (.Resources.GetMatch .Params.cover).RelPermalink }}" data-alt="{{ .Params.cover_alt }}">查看完整原图</button><div class="detail-body"><div class="prose">{{ .Content }}</div><aside class="photo-facts"><h2>作品档案</h2><dl><dt>作者 / 机构</dt><dd>{{ .Params.author }}</dd><dt>拍摄 / 发布</dt><dd>{{ .Params.date_label }}</dd><dt>使用许可</dt><dd>{{ .Params.license }}</dd></dl><p class="source-credit"><a data-photo-source href="{{ .Params.source }}">原始作品与署名</a></p><p class="source-credit"><a data-photo-license href="{{ .Params.license_url }}">查看授权说明</a></p><p>{{ .Params.rights_note }}</p></aside></div></main>{{ end }}
