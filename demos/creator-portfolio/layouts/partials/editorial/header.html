<header class="editorial-masthead">
  <div class="shell editorial-masthead-inner">
    <a class="editorial-wordmark" href="{{ site.Home.RelPermalink }}" aria-label="返回作品集首页"><span aria-hidden="true">↗</span>{{ site.Home.Params.brand }}</a>
    <span class="editorial-edition">{{ site.Home.Params.edition }}</span>
    <nav class="editorial-site-nav" aria-label="主导航">
      {{ range slice "works" "projects" }}{{ $section := site.GetPage (printf "/%s" .) }}<a href="{{ $section.RelPermalink }}"{{ if eq $.Section . }} aria-current="page"{{ end }}>{{ $section.Title }}</a>{{ end }}
    </nav>
  </div>
</header>
