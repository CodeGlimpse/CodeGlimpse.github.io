{{ $scene := site.Home.Params }}
<section class="panel map-panel workbench-map-panel" aria-labelledby="terrain-heading">
  <header class="panel-heading"><div><p class="panel-kicker">{{ $scene.mapKicker }}</p><h2 id="terrain-heading" tabindex="-1">{{ $scene.mapTitle }}</h2></div><span class="map-scale">路线顺序实时同步</span></header>
  <svg class="terrain-map" data-map-scene="{{ $scene.mapScene }}" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="map-title map-description"><title id="map-title">{{ $scene.mapDescription }}</title><desc id="map-description">八个虚构海岛地点的示意位置。蓝色连线与数字按行程顺序更新。非真实地理导航。</desc>
    {{ partial "map-islands.html" . }}
    <polyline id="itinerary-route" class="map-route" points="" hidden/>
    {{ partial "map-pins.html" (dict "interactive" true) }}
  </svg>
  <div class="map-caption"><p><span class="route-swatch" aria-hidden="true"></span>蓝线与编号按清单顺序连接 · 地图标记可查看详情</p><p>{{ $scene.mapNote }} 每段交通统一估算 20 分钟。</p></div>
</section>
