<main id="main" class="archive-listing shell" tabindex="-1" data-archive><header class="archive-intro"><div><p class="archive-kicker">ARCHIVE / {{ .Section }}</p><h1>{{ .Title }}</h1></div><p>{{ .Params.summary }}</p></header><div class="archive-workbench">{{ partial "archive/preview.html" . }}<div class="archive-index"><div class="archive-index-label"><span>RECORD INDEX</span><span>{{ printf "%02d" (len .Pages) }} ENTRIES</span></div>{{ partial "archive/entries.html" (dict "pages" .Pages.ByWeight "prefix" .Section) }}</div></div></main>
