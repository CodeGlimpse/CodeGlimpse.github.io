name: Build and deploy to GitHub Pages

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: true

env:
    GO_VERSION: "1.23.6"
    HUGO_VERSION: "0.157.0"
    NODE_VERSION: "22.13.1"

jobs:
    build:
        name: Build and test
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            - name: Setup Go
              uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install Node.js dependencies
              run: npm ci --ignore-scripts

            - name: Cache Hugo resources
              uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
              with:
                  path: resources
                  key: ${{ runner.os }}-hugo-resources-${{ hashFiles('go.mod', 'go.sum', 'config/_default/module.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-hugo-resources-

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@19661a5c56c987b713f1f00f022671286b04f53b # v2.0.0
              with:
                  hugo-version: ${{ env.HUGO_VERSION }}
                  extended: true

            - name: Check JavaScript syntax
              run: npm run check:js

            - name: Check workflow security
              run: npm run check:workflow

            - name: Check toolchain versions
              run: npm run check:versions

            - name: Check content structure
              run: npm run check:content

            - name: Run tests
              run: npm test

            - name: Build
              run: hugo --cleanDestinationDir --minify --gc

            - name: Check build output
              run: npm run check:output

            - name: Write build summary
              if: always()
              env:
                  SUMMARY_STAGE: build
              run: node scripts/write-site-summary.cjs

            - name: Upload site artifact
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: github-pages-site
                  path: public
                  if-no-files-found: error
                  retention-days: 1

    e2e:
        name: Browser end-to-end
        needs: build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 1

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm

            - name: Install Node.js dependencies
              run: npm ci --ignore-scripts

            - name: Download site artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: github-pages-site
                  path: public

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Run browser tests
              env:
                  E2E_BASE_URL: http://127.0.0.1:4173
                  E2E_USE_LOCAL_SERVER: "true"
              run: npm run test:e2e

    deploy:
        name: Deploy
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        needs: [build, e2e]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Download site artifact
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
              with:
                  name: github-pages-site
                  path: public

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@6c2d9db40f9296374acc17b90404b6e8864128c8 # v4.7.3
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: gh-pages
                  folder: public
                  clean: true
                  single-commit: true
                  commit-message: "deploy: source=${{ github.sha }}"

            - name: Smoke test deployed site
              env:
                  SITE_URL: "https://blog.codeglimpse.top"
              run: npm run check:site

            - name: Write deployment summary
              if: always()
              env:
                  SUMMARY_STAGE: deploy
              run: node scripts/write-site-summary.cjs
